# File: docker-compose.yml
# Description: Local development environment setup containing PostgreSQL and the Next.js app.

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: template_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: templatedb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: template_web
    restart: always
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/templatedb
    depends_on:
      - postgres

volumes:
  postgres_data:
